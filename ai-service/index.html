<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Perfume Advisor - Demo</title>
<style>
  :root {
    --primary: #667eea;
    --bg: #f5f7fa;
    --card-bg: #fff;
    --border: #ddd;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: #1a1a2e;
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    padding: 2rem;
  }
  .container {
    width: 100%; max-width: 520px;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
    display: flex; flex-direction: column;
  }
  .header { padding: 2rem; text-align: center; }
  .header h1 { font-size: 1.6rem; color: #2c3e50; margin-bottom: .4rem; }
  .header p { color: #666; font-size: .9rem; }

  .status {
    text-align: center; padding: 1.2rem .8rem;
    background: #f8f9fa; margin: 1rem 1.5rem;
    border-radius: var(--radius);
    font-size: .95rem;
  }
  .status.ok { color: #155724; background: #d4edda; }
  .status.err { color: #721c24; background: #f8d7da; }

  .form-card { padding: 1.5rem; background: #fafafa; }
  .form-card h2 { font-size: 1.1rem; color: #2c3e50; margin-bottom: 1rem; }
  .form-group { margin-bottom: 1rem; }
  label { display: block; font-weight: 600; margin-bottom: .3rem; font-size: .9rem; color: #333; }
  input[type=text] {
    width: 100%; padding: .75rem 1rem; border: 1px solid var(--border);
    border-radius: 8px; font-size: 1rem; transition: border .2s;
  }
  input[type=text]:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(102,129,237,.1);
  }
  button {
    width: 100%; padding: .85rem; background: var(--primary); color: #fff;
    border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;
    font-weight: 600; transition: background .2s;
  }
  button:hover { background: #5568d5; }
  button:disabled { background: #bbb; cursor: not-allowed; }

  .results { padding: .8rem 1.5rem 1.5rem; }
  .results h3 { font-size: 1rem; color: #333; margin-bottom: .8rem; }
  #resultsList { list-style: none; }
  .results li {
    display: flex; justify-content: space-between; align-items: center;
    padding: .6rem 0; border-bottom: 1px solid #eee;
  }
  .results li:last-child { border-bottom: none; }
  .score { font-weight: 700; color: var(--primary); font-size: 1.1rem; }
  .perfumeId { color: #555; font-size: .9rem; }
  .badge {
    padding: .2rem .8rem; border-radius: 20px; font-size: .8rem; font-weight: 600;
    background: #e8f0fe; color: #2a5d9e;
  }
  .loading { text-align: center; padding: 1rem; color: #999; font-style: italic; }
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <h1>Perfume Advisor</h1>
    <p>Recomendaciones de perfumes basadas en contenido</p>
  </div>

  <div class="status" id="statusBox">Cargando modelo…</div>

  <div class="form-card">
    <h2>🔍 Busca tu perfume</h2>
    <form id="predictForm">
      <div class="form-group">
        <label for="query">¿Qué buscas?</label>
        <input type="text" id="query" placeholder="Ejemplo: fresquito marino para verano" autocomplete="off" required>
      </div>
      <button type="submit">Buscar</button>
    </form>
  </div>

  <div class="results">
    <h3>Recomendaciones</h3>
    <ul id="resultsList">
      <li class="loading">Escribe una consulta y presiona Buscar</li>
    </ul>
  </div>
</div>

<script>
  const API = "http://127.0.0.1:8000";
  const statusBox = document.getElementById("statusBox");
  const queryInput = document.getElementById("query");
  const resultsList = document.getElementById("resultsList");
  const form = document.getElementById("predictForm");

  // Estado del modelo
  async function loadHealth() {
    try {
      const r = await fetch(API + "/health");
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      statusBox.innerHTML = `✅ ${d.perfumes.toLocaleString()} perfumes | ${d.terms.toLocaleString()} términos`;
      statusBox.className = "status ok";
    } catch (e) {
      statusBox.textContent = "❌ No se pudo conectar al servidor";
      statusBox.className = "status err";
    }
  }

  // Consulta al backend
  async function fetchPredict(query) {
    const r = await fetch(API + "/predict", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        consulta: query,
        preferencias: [],
        topK: 5
      })
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  }

  // Renderizar resultados
  function render(data) {
    if (!data?.resultados?.length) {
      resultsList.innerHTML = '<li class="badge">No se encontraron perfumes</li>';
      return;
    }
    resultsList.innerHTML = data.resultados.map(r =>
      `<li><span class="score">${r.puntuacion.toFixed(3)}</span><span class="perfumeId">${r.perfumeId}</span></li>`
    ).join("");
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const q = queryInput.value.trim();
    if (!q) return;
    form.querySelector("button").disabled = true;
    queryInput.placeholder = "Buscando…";
    resultsList.innerHTML = '<li class="loading">Consultando IA…</li>';

    try {
      const d = await fetchPredict(q);
      render(d);
    } catch (err) {
      resultsList.innerHTML = '<li class="badge">Error de conexión</li>';
    }
    form.querySelector("button").disabled = false;
    queryInput.placeholder = "Ejemplo: fresquito marino para verano";
  });

  // Inicial
  loadHealth();
</script>
</body>
</html>
